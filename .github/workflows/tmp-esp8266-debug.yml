name: Temporary ESP8266 debug build

on:
  push:
    branches:
      - tmp/esp8266-memory-map-20260913

permissions:
  contents: write

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: arduino/setup-arduino-cli@v2
      - name: Install core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2
      - name: Build and capture log
        shell: bash
        run: |
          set +e
          mkdir -p ci-memory-debug "$HOME/Arduino/libraries"
          git worktree add /tmp/sd-v26.4 v26.4
          rm -rf "$HOME/Arduino/libraries/SuplaDevice"
          ln -s /tmp/sd-v26.4 "$HOME/Arduino/libraries/SuplaDevice"
          arduino-cli compile --verbose --fqbn esp8266:esp8266:generic --build-path /tmp/build-v26.4 /tmp/sd-v26.4/examples/esp/Simple > ci-memory-debug/v26.4-compile.log 2>&1
          echo $? > ci-memory-debug/v26.4-exit-code.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ci-memory-debug
          git commit -m 'tmp: save ESP8266 build diagnostics' || true
          git push origin HEAD:tmp/esp8266-memory-map-20260913
          exit 0
