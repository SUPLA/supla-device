name: Temporary ESP8266 normalized memory experiments

on:
  push:
    branches:
      - tmp/esp8266-memory-map-20260913
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalized-memory-experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: arduino/setup-arduino-cli@v2
      - name: Install toolchain and libraries
        shell: bash
        run: |
          set -euxo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2
          arduino-cli lib install DallasTemperature OneWire "DHT Sensor Library" "Adafruit AHTX0" HX711_ADC PZEM004Tv30
          mkdir -p "$HOME/Arduino/libraries"
          cd "$HOME/Arduino/libraries"
          git clone --depth 1 https://github.com/olehs/PZEM004T || true
          git clone --depth 1 https://github.com/kevinlutzer/Arduino-PM1006K || true
          git clone --depth 1 https://github.com/arduino-libraries/Arduino_JSON || true

      - name: Prepare one fixed source path
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --tags --force
          git worktree remove --force /tmp/sd-work 2>/dev/null || true
          rm -rf /tmp/sd-work
          git worktree add --detach /tmp/sd-work v26.8
          rm -rf "$HOME/Arduino/libraries/SuplaDevice"
          ln -s /tmp/sd-work "$HOME/Arduino/libraries/SuplaDevice"

      - name: Build normalized variants
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf out-normalized
          mkdir -p out-normalized
          TOOLROOT="$HOME/.arduino15/packages/esp8266/tools/xtensa-lx106-elf-gcc"
          NM="$(find "$TOOLROOT" -type f -name xtensa-lx106-elf-nm | head -n1)"
          SIZE="$(find "$TOOLROOT" -type f -name xtensa-lx106-elf-size | head -n1)"

          reset_v268() {
            cd /tmp/sd-work
            git reset --hard v26.8
            git clean -fd
          }

          build_one() {
            name="$1"
            out="$GITHUB_WORKSPACE/out-normalized/$name"
            rm -rf "$out"
            mkdir -p "$out/build"
            arduino-cli compile --fqbn esp8266:esp8266:generic --build-path "$out/build" --warnings all /tmp/sd-work/examples/esp/Simple 2>&1 | tee "$out/compile.log"
            elf="$(find "$out/build" -type f -name '*.elf' | head -n1)"
            map="$(find "$out/build" -type f -name '*.map' | head -n1)"
            cp "$elf" "$out/Simple.elf"
            cp "$map" "$out/Simple.map"
            "$SIZE" -A "$elf" > "$out/size-sections.txt"
            "$NM" -S --size-sort -C "$elf" > "$out/nm-size-sort.txt"
            grep -E 'Variables and constants|Instruction RAM|Code in flash' "$out/compile.log" > "$out/arduino-memory.txt" || true
            grep -E 'core_esp8266_app_entry_noextra4k|g_cont|ESP8266WiFiSTA-WPS' "$map" > "$out/extra4k-map.txt" || true
          }

          reset_v268
          build_one baseline-a

          # Same sources, second build: check reproducibility with fixed source path.
          reset_v268
          build_one baseline-b

          # Disable SRPC packet hooks only.
          reset_v268
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/sd-work/src/supla-common/srpc.h')
          s=p.read_text()
          marker='#define SRPC_WITH_PACKET_LOG_HOOKS\n#endif\n'
          repl=marker+'\n#if defined(ESP8266) || defined(ARDUINO_ARCH_ESP8266)\n#undef SRPC_WITH_PACKET_LOG_HOOKS\n#endif\n'
          if marker not in s: raise SystemExit('marker missing')
          p.write_text(s.replace(marker,repl,1))
          PY
          build_one nosrpc

          # Restore only v26.4 global HTML/JS/CSS source file.
          reset_v268
          git -C /tmp/sd-work show v26.4:src/supla/network/html_generator.cpp > /tmp/sd-work/src/supla/network/html_generator.cpp
          build_one oldhtml

          # Explicitly force ESP8266 no-extra-4k mode on otherwise unchanged v26.8.
          reset_v268
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/sd-work/examples/esp/Simple/Simple.ino')
          s=p.read_text()
          s=s.replace('#include <SuplaDevice.h>', '#include <SuplaDevice.h>\n#ifdef ESP8266\n#include <coredecls.h>\n#endif', 1)
          needle='void setup() {'
          repl='void setup() {\n#ifdef ESP8266\n  disable_extra4k_at_link_time();\n#endif'
          if needle not in s: raise SystemExit('setup missing')
          p.write_text(s.replace(needle,repl,1))
          PY
          build_one noextra4k

      - name: Generate normalized report
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('out-normalized')
          names=['baseline-a','baseline-b','nosrpc','oldhtml','noextra4k']
          def sec(n):
            d={}
            for line in (root/n/'size-sections.txt').read_text(errors='replace').splitlines():
              m=re.match(r'^([.A-Za-z0-9_]+)\s+(\d+)\s+',line.strip())
              if m:d[m.group(1)]=int(m.group(2))
            return d
          data={n:sec(n) for n in names}
          b=data['baseline-a']
          bram=sum(b.get(x,0) for x in ['.data','.rodata','.bss'])
          with (root/'normalized-report.txt').open('w') as f:
            f.write('ESP8266 core 3.1.2; fixed source path /tmp/sd-work\n')
            f.write('variant\t.data\t.rodata\t.bss\tflash\tRAM\tdRAM\tdFlash\tnoextra4k\n')
            for n in names:
              s=data[n]
              ram=sum(s.get(x,0) for x in ['.data','.rodata','.bss'])
              noextra='yes' if 'g_cont' in (root/n/'extra4k-map.txt').read_text(errors='replace') else 'no'
              f.write(f"{n}\t{s.get('.data',0)}\t{s.get('.rodata',0)}\t{s.get('.bss',0)}\t{s.get('.irom0.text',0)}\t{ram}\t{ram-bram:+d}\t{s.get('.irom0.text',0)-b.get('.irom0.text',0):+d}\t{noextra}\n")
            f.write('\nArduino summaries:\n')
            for n in names:
              f.write(n+': '+' | '.join((root/n/'arduino-memory.txt').read_text(errors='replace').splitlines())+'\n')

          def nm(n):
            d={}
            for line in (root/n/'nm-size-sort.txt').read_text(errors='replace').splitlines():
              p=line.split(None,3)
              if len(p)<4:continue
              try:z=int(p[1],16)
              except:continue
              d[(p[2],p[3])]=d.get((p[2],p[3]),0)+z
            return d
          base=nm('baseline-a')
          for n in ['nosrpc','oldhtml','noextra4k']:
            x=nm(n); rows=[]
            for k in set(base)|set(x):
              delta=x.get(k,0)-base.get(k,0)
              if delta: rows.append((delta,base.get(k,0),x.get(k,0),k[0],k[1]))
            rows.sort(key=lambda r:abs(r[0]),reverse=True)
            with (root/f'{n}-delta.txt').open('w') as f:
              f.write('delta\tbaseline\tvariant\ttype\tsymbol\n')
              for r in rows[:200]:f.write('%d\t%d\t%d\t%s\t%s\n'%r)
          PY
          cat out-normalized/normalized-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: esp8266-normalized-memory-core-3.1.2
          path: out-normalized/

      - name: Commit normalized reports
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf ci-memory-normalized
          mkdir -p ci-memory-normalized
          cp out-normalized/normalized-report.txt ci-memory-normalized/
          cp out-normalized/*-delta.txt ci-memory-normalized/
          for d in out-normalized/baseline-a out-normalized/baseline-b out-normalized/nosrpc out-normalized/oldhtml out-normalized/noextra4k; do
            n="$(basename "$d")"; mkdir -p "ci-memory-normalized/$n"; cp "$d/arduino-memory.txt" "$d/extra4k-map.txt" "ci-memory-normalized/$n/";
          done
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ci-memory-normalized
          git commit -m 'tmp: add normalized ESP8266 memory results' || true
          git push origin HEAD:tmp/esp8266-memory-map-20260913
