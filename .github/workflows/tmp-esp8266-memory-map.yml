name: Temporary ESP8266 fixed-stack memory experiments

on:
  push:
    branches:
      - tmp/esp8266-memory-map-20260913
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fixed-stack-experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: arduino/setup-arduino-cli@v2
      - name: Install toolchain and libraries
        shell: bash
        run: |
          set -euxo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2
          arduino-cli lib install DallasTemperature OneWire "DHT Sensor Library" "Adafruit AHTX0" HX711_ADC PZEM004Tv30
          mkdir -p "$HOME/Arduino/libraries"
          cd "$HOME/Arduino/libraries"
          git clone --depth 1 https://github.com/olehs/PZEM004T || true
          git clone --depth 1 https://github.com/kevinlutzer/Arduino-PM1006K || true
          git clone --depth 1 https://github.com/arduino-libraries/Arduino_JSON || true

      - name: Prepare fixed source path
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --tags --force
          git worktree remove --force /tmp/sd-work 2>/dev/null || true
          rm -rf /tmp/sd-work
          git worktree add --detach /tmp/sd-work v26.8
          rm -rf "$HOME/Arduino/libraries/SuplaDevice"
          ln -s /tmp/sd-work "$HOME/Arduino/libraries/SuplaDevice"

      - name: Build fixed-stack variants
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf out-fixed-stack
          mkdir -p out-fixed-stack
          TOOLROOT="$HOME/.arduino15/packages/esp8266/tools/xtensa-lx106-elf-gcc"
          NM="$(find "$TOOLROOT" -type f -name xtensa-lx106-elf-nm | head -n1)"
          SIZE="$(find "$TOOLROOT" -type f -name xtensa-lx106-elf-size | head -n1)"

          force_noextra4k() {
            python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/sd-work/examples/esp/Simple/Simple.ino')
          s=p.read_text()
          if '#include <coredecls.h>' not in s:
              s=s.replace('#include <SuplaDevice.h>', '#include <SuplaDevice.h>\n#ifdef ESP8266\n#include <coredecls.h>\n#endif', 1)
          if 'disable_extra4k_at_link_time();' not in s:
              s=s.replace('void setup() {', 'void setup() {\n#ifdef ESP8266\n  disable_extra4k_at_link_time();\n#endif', 1)
          p.write_text(s)
          PY
          }

          checkout_tag() {
            tag="$1"
            cd /tmp/sd-work
            git reset --hard "$tag"
            git clean -fd
            force_noextra4k
          }

          build_one() {
            name="$1"
            out="$GITHUB_WORKSPACE/out-fixed-stack/$name"
            rm -rf "$out"; mkdir -p "$out/build"
            arduino-cli compile --fqbn esp8266:esp8266:generic --build-path "$out/build" --warnings all /tmp/sd-work/examples/esp/Simple 2>&1 | tee "$out/compile.log"
            elf="$(find "$out/build" -type f -name '*.elf' | head -n1)"
            map="$(find "$out/build" -type f -name '*.map' | head -n1)"
            cp "$elf" "$out/Simple.elf"; cp "$map" "$out/Simple.map"
            "$SIZE" -A "$elf" > "$out/size-sections.txt"
            "$NM" -S --size-sort -C "$elf" > "$out/nm-size-sort.txt"
            grep -E 'Variables and constants|Instruction RAM|Code in flash' "$out/compile.log" > "$out/arduino-memory.txt" || true
            grep -E 'g_cont|core_esp8266_app_entry_noextra4k' "$map" > "$out/stack-map.txt" || true
          }

          # v26.4 and v26.8 with identical forced no-extra-4k stack mode.
          checkout_tag v26.4
          build_one v26.4-noextra4k

          checkout_tag v26.8
          build_one v26.8-noextra4k

          # Same v26.8 + packet hooks disabled, while still forcing no-extra-4k.
          checkout_tag v26.8
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/sd-work/src/supla-common/srpc.h')
          s=p.read_text(); marker='#define SRPC_WITH_PACKET_LOG_HOOKS\n#endif\n'
          repl=marker+'\n#if defined(ESP8266) || defined(ARDUINO_ARCH_ESP8266)\n#undef SRPC_WITH_PACKET_LOG_HOOKS\n#endif\n'
          if marker not in s: raise SystemExit('SRPC marker missing')
          p.write_text(s.replace(marker,repl,1))
          PY
          build_one v26.8-noextra4k-nosrpc

          # Same v26.8 + v26.4 HTML generator assets, same stack mode.
          checkout_tag v26.8
          git -C /tmp/sd-work show v26.4:src/supla/network/html_generator.cpp > /tmp/sd-work/src/supla/network/html_generator.cpp
          build_one v26.8-noextra4k-oldhtml

      - name: Generate fixed-stack report
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('out-fixed-stack')
          names=['v26.4-noextra4k','v26.8-noextra4k','v26.8-noextra4k-nosrpc','v26.8-noextra4k-oldhtml']
          def sec(n):
            d={}
            for line in (root/n/'size-sections.txt').read_text(errors='replace').splitlines():
              m=re.match(r'^([.A-Za-z0-9_]+)\s+(\d+)\s+',line.strip())
              if m:d[m.group(1)]=int(m.group(2))
            return d
          data={n:sec(n) for n in names}; b=data['v26.8-noextra4k']
          bram=sum(b.get(x,0) for x in ['.data','.rodata','.bss'])
          with (root/'fixed-stack-report.txt').open('w') as f:
            f.write('ESP8266 core 3.1.2; fixed source path; no-extra-4k forced for every variant\n')
            f.write('variant\t.data\t.rodata\t.bss\tflash\tRAM\tdRAM_vs_v26.8\tdFlash_vs_v26.8\n')
            for n in names:
              s=data[n]; ram=sum(s.get(x,0) for x in ['.data','.rodata','.bss'])
              f.write(f"{n}\t{s.get('.data',0)}\t{s.get('.rodata',0)}\t{s.get('.bss',0)}\t{s.get('.irom0.text',0)}\t{ram}\t{ram-bram:+d}\t{s.get('.irom0.text',0)-b.get('.irom0.text',0):+d}\n")
            f.write('\nArduino summaries:\n')
            for n in names:
              f.write(n+': '+' | '.join((root/n/'arduino-memory.txt').read_text(errors='replace').splitlines())+'\n')

          def nm(n):
            d={}
            for line in (root/n/'nm-size-sort.txt').read_text(errors='replace').splitlines():
              p=line.split(None,3)
              if len(p)<4:continue
              try:z=int(p[1],16)
              except:continue
              d[(p[2],p[3])]=d.get((p[2],p[3]),0)+z
            return d
          base=nm('v26.8-noextra4k')
          for n in ['v26.8-noextra4k-nosrpc','v26.8-noextra4k-oldhtml']:
            x=nm(n); rows=[]
            for k in set(base)|set(x):
              delta=x.get(k,0)-base.get(k,0)
              if delta:rows.append((delta,base.get(k,0),x.get(k,0),k[0],k[1]))
            rows.sort(key=lambda r:abs(r[0]),reverse=True)
            with (root/f'{n}-delta.txt').open('w') as f:
              f.write('delta\tbaseline\tvariant\ttype\tsymbol\n')
              for r in rows[:200]:f.write('%d\t%d\t%d\t%s\t%s\n'%r)
          PY
          cat out-fixed-stack/fixed-stack-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: esp8266-fixed-stack-memory-core-3.1.2
          path: out-fixed-stack/

      - name: Commit reports
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf ci-memory-fixed-stack; mkdir -p ci-memory-fixed-stack
          cp out-fixed-stack/fixed-stack-report.txt out-fixed-stack/*-delta.txt ci-memory-fixed-stack/
          git config user.name github-actions; git config user.email github-actions@github.com
          git add ci-memory-fixed-stack
          git commit -m 'tmp: add fixed-stack ESP8266 memory results' || true
          git push origin HEAD:tmp/esp8266-memory-map-20260913
